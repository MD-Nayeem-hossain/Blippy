name: Windows Build

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.2'
        target: 'desktop'
        arch: 'win64_mingw'
        modules: 'qtdeclarative qtquickcontrols2 qtsvg'
        cache: true

    - name: Set up MinGW
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64

    - name: Build project
      run: |
        qmake Blippy.pro
        mingw32-make -j4

    - name: Deploy with windeployqt
      run: |
        windeployqt.exe --release release\Blippy.exe

    - name: Create archive
      run: |
        7z a Blippy-Windows-Release.zip release\*

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blippy-Windows-Release
        path: Blippy-Windows-Release.zip
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: Blippy-Windows-Release.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
