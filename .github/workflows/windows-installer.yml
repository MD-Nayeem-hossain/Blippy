name: Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.3'
        target: 'desktop'
        arch: 'win64_mingw'
        modules: 'qtdeclarative qtquickcontrols2 qtsvg'
        cache: true

    - name: Build project
      run: |
        qmake Blippy.pro
        mingw32-make -j4

    - name: Deploy with windeployqt
      run: |
        windeployqt.exe --release --compiler-runtime release\Blippy.exe

    - name: Install Inno Setup
      run: |
        choco install innosetup --yes --no-progress

    - name: Build installer
      run: |
        iscc installer\blippy.iss

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blippy-Windows-Installer
        path: release\Blippy-Setup-*.exe
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: release/Blippy-Setup-*.exe
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
