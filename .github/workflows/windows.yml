name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true

    - name: Configure and Build
      shell: cmd
      run: |
        qmake Blippy.pro
        mingw32-make -j4

    - name: Inspect Qt plugins
      shell: cmd
      run: |
        dir "%QT_ROOT_DIR%\plugins"
        dir "%QT_ROOT_DIR%\plugins\platforms"

    - name: qmake query
      shell: cmd
      run: |
        "%QT_ROOT_DIR%\bin\qmake.exe" -query

    - name: Deploy Qt DLLs
      shell: cmd
      run: |
        "%QT_ROOT_DIR%\bin\windeployqt.exe" --verbose 2 --release --compiler-runtime release\Blippy.exe

    - name: Install Inno Setup
      shell: cmd
      run: choco install innosetup -y --no-progress

    - name: Build Installer
      shell: cmd
      run: iscc installer\blippy.iss

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: Blippy-Setup
        path: release\Blippy-Setup-*.exe
        if-no-files-found: error

    - name: Attach to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: release/Blippy-Setup-*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
